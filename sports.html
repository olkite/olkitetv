<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup TV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1e293b; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; z-index: 10; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo { height: 35px; width: auto; filter: brightness(0) invert(1); }
        header h1 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        main { flex: 1; display: flex; overflow: hidden; }
        .player-container { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
        .video-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; outline: none; background: #000; }
        .player-footer { background: #1e293b; padding: 12px 20px; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .now-playing { display: flex; align-items: center; gap: 10px; }
        .status-indicator { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }
        .channel-title { font-size: 0.95rem; font-weight: 600; color: #f8fafc; }
        aside { width: 320px; display: flex; flex-direction: column; background: #1e293b; border-left: 1px solid #334155; }
        .search-container { padding: 12px; border-bottom: 1px solid #334155; }
        .search-input { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #f8fafc; font-size: 0.85rem; outline: none; }
        .search-input:focus { border-color: #38bdf8; }
        .channels-list { flex: 1; overflow-y: auto; padding: 5px; contain: content; }
        .channel-item { display: flex; align-items: center; padding: 10px 12px; margin-bottom: 2px; border-radius: 6px; cursor: pointer; transition: background 0.1s; border: 1px solid transparent; }
        .channel-item:hover { background: #334155; }
        .channel-item.active { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
        .channel-number { font-size: 0.7rem; color: #64748b; width: 25px; }
        .channel-name { font-size: 0.85rem; font-weight: 500; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item.active .channel-name { color: #38bdf8; font-weight: 700; }
        footer { background: #0f172a; padding: 6px 20px; text-align: center; font-size: 0.7rem; color: #64748b; border-top: 1px solid #1e293b; }
        #loadingOverlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 5; }
        .spinner { width: 30px; height: 30px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; padding: 8px 16px; border-radius: 4px; font-size: 0.8rem; display: none; z-index: 100; }
        @media (max-width: 768px) { main { flex-direction: column; } aside { width: 100%; height: 45%; } .player-container { height: 55%; } }
    </style>
</head>

        const video = document.getElementById('video');
        const channelsList = document.getElementById('channelsList');
        const searchInput = document.getElementById('searchInput');
        const currentChannelName = document.getElementById('currentChannelName');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorToast = document.getElementById('errorToast');
        const channelCountDisplay = document.getElementById('channelCount');
        
        let hls = null;
        let currentIndex = 0;
        let retryCount = 0;
        const MAX_RETRIES = 1;

        function showToast(message) {
            errorToast.textContent = message;
            errorToast.style.display = 'block';
            setTimeout(() => errorToast.style.display = 'none', 3000);
        }

        function playNextChannel() {
            currentIndex = (currentIndex + 1) % channelsData.length;
            showToast("Stream failed. Skipping to next channel...");
            playChannelByIndex(currentIndex);
        }

        function playChannelByIndex(index) {
            currentIndex = index;
            const channel = channelsData[index];
            initPlayer(channel.url, channel.name);
            
            // Highlight in list
            document.querySelectorAll('.channel-item').forEach((el, i) => {
                if (i === index) {
                    el.classList.add('active');
                    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function initPlayer(url, name) {
            loadingOverlay.style.display = 'flex';
            currentChannelName.textContent = name;
            retryCount = 0;

            if (hls) hls.destroy();

            if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('.ts'))) {
                hls = new Hls({
                    capLevelToPlayerSize: true,
                    autoStartLoad: true,
                    enableWorker: true,
                    lowLatencyMode: true,
                    manifestLoadingTimeOut: 5000,
                    levelLoadingTimeOut: 5000
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                    loadingOverlay.style.display = 'none';
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error("HLS fatal error:", data.type);
                        playNextChannel();
                    }
                });
            } else {
                video.src = url;
                video.play().catch(() => {});
                loadingOverlay.style.display = 'none';
            }
        }

        // Handle video element errors
        video.onerror = () => {
            if (video.src) playNextChannel();
        };

        function renderChannels(filter = '') {
            const fragment = document.createDocumentFragment();
            const filtered = channelsData.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (channelsData.indexOf(channel) === currentIndex) item.classList.add('active');
                
                item.innerHTML = `<span class="channel-number">${index + 1}</span><span class="channel-name">${channel.name}</span>`;
                item.onclick = () => playChannelByIndex(channelsData.indexOf(channel));
                fragment.appendChild(item);
            });
            
            channelsList.innerHTML = '';
            channelsList.appendChild(fragment);
            channelCountDisplay.textContent = `${filtered.length} Channels`;
        }

        searchInput.addEventListener('input', (e) => renderChannels(e.target.value));
        
        window.onload = () => {
            renderChannels();
            if (channelsData.length > 0) playChannelByIndex(0);
        };
    </script>
