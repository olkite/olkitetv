    <style>
        :root { --bg: #05060d; --accent: #00d4ff; --text: #ffffff; --muted: #a0a9c9; --border: rgba(255,255,255,.1); }

        body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; -webkit-user-select: none; user-select: none; overflow-x: hidden; min-height: 100vh; }

        .preloader-text { font-size: 3rem; animation: pulse 1.5s infinite ease-in-out; }

        .header { padding: 12px 15px; border-bottom: 1px solid var(--border); background: var(--bg); }
        .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .logo { font-size: 1.5rem; font-weight: 900; cursor: pointer; color: var(--accent); }
        .search-box { flex: 1; position: relative; max-width: 300px; }
        .search-box input { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 50px; padding: 8px 15px 8px 35px; color: #fff; outline: none; font-size: 0.85rem; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.75rem; }

        .player-wrapper { position: sticky; top: 0; z-index: 5000; background: #000; border-bottom: 2px solid var(--accent); display: none; }
        .player-wrapper.show { display: block; }
        .player-container { max-width: 500px; margin: 0 auto; position: relative; background: #000; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .player-info { padding: 5px 10px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-between; align-items: center; }
        .player-info h3 { font-size: 0.75rem; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .live-tag { background: #ff0055; color: #fff; padding: 1px 5px; border-radius: 3px; font-size: 0.55rem; font-weight: 900; }

        .main { max-width: 1200px; margin: 0 auto; padding: 10px; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 5px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; color: #fff; cursor: pointer; white-space: nowrap; font-size: 0.75rem; }
        .cat-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .card { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
        .card:hover { border-color: var(--accent); background: rgba(255,255,255,.06); }
        .card img { width: 35px; height: 35px; object-fit: contain; }
        .card-name { font-weight: 700; font-size: 0.7rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
        .no-logo { width: 35px; height: 35px; background: var(--accent); color: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1rem; }

        /* Load More Button */
        .load-more-container { display: flex; justify-content: center; margin: 30px 0; }
        .load-more-btn { background: var(--accent); color: #000; border: none; padding: 10px 30px; border-radius: 50px; font-weight: 900; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .load-more-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--accent); }
        .load-more-btn.hidden { display: none; }

        .footer { margin-top: 30px; padding: 15px; border-top: 1px solid var(--border); text-align: center; }
        .footer p { font-size: 0.75rem; color: var(--muted); }
        .footer a { color: var(--accent); text-decoration: none; font-weight: 700; }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .player-container { max-width: 100%; }

        let currentCount = 60;
        let activeCat = 'All';
        let filteredList = [];
        const catBar = document.getElementById('category-bar');
        const grid = document.getElementById('channel-grid');
        const searchInput = document.getElementById('searchInput');
        const playerWrapper = document.getElementById('player-wrapper');
        const tvPlayer = document.getElementById('tv-player');
        const currentChannelEl = document.getElementById('current-channel');
        
        function renderGrid(append = false) {
            const items = filteredList.slice(0, currentCount);
            if (!append) grid.innerHTML = '';
            
            items.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none'">` : ''}
                    <div class="no-logo" style="${ch.logo ? 'display:none' : ''}">${ch.name.charAt(0).toUpperCase()}</div>
                    <div class="card-name">${ch.name}</div>
                `;
                card.onclick = () => playChannel(ch);
                grid.appendChild(card);
            });
            
            const btn = document.getElementById('load-more-btn');
            btn.classList.toggle('hidden', currentCount >= filteredList.length);
        }
        
        function playChannel(ch) {
            playerWrapper.classList.add('show');
            currentChannelEl.textContent = ch.name;
            
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(tvPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => tvPlayer.play());
            } else if (tvPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                tvPlayer.src = ch.url;
                tvPlayer.play();
            }
        }
        
        window.loadMore = () => {
            currentCount += 60;
            renderGrid(true);
        };
        
        function initApp() {
            if (!CHANNELS || CHANNELS.length === 0) return;
            filteredList = CHANNELS;
            const groups = ['All', ...new Set(CHANNELS.map(c => c.group))];
            catBar.innerHTML = groups.map(g => `<button class="cat-btn ${g === 'All' ? 'active' : ''}" onclick="filterCat('${g}', this)">${g}</button>`).join('');
            renderGrid();
            const loader = document.getElementById('preloader');
            if(loader) {
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 800);
            }
        }
        
        window.filterCat = (cat, btn) => {
            activeCat = cat;
            currentCount = 60;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filteredList = cat === 'All' ? CHANNELS : CHANNELS.filter(c => c.group === cat);
            renderGrid();
        };
        
        searchInput.oninput = (e) => {
            const val = e.target.value.toLowerCase();
            currentCount = 60;
            filteredList = CHANNELS.filter(c => c.name.toLowerCase().includes(val));
            renderGrid();
        };
        
        document.addEventListener('contextmenu', e => e.preventDefault());
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
