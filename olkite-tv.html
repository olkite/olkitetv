  <style>
    :root { --bg: #05060d; --accent: #00d4ff; --text: #ffffff; --muted: #a0a9c9; --border: rgba(255,255,255,.1); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; -webkit-user-select: none; user-select: none; }
    
    .preloader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); }
    .preloader img { width: 100px; filter: brightness(0) invert(1); margin-bottom: 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    .header { padding: 15px 20px; border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .logo img { width: 80px; filter: brightness(0) invert(1); }
    .search-box { flex: 1; position: relative; }
    .search-box input { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 50px; padding: 8px 15px 8px 35px; color: #fff; outline: none; }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

    /* Compact Sticky Player */
    .sticky-player { position: sticky; top: 0; z-index: 5000; background: var(--bg); display: none; border-bottom: 1px solid var(--border); padding: 5px 0; }
    .sticky-player.show { display: block; }
    .player-container { max-width: 500px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
    .video-wrap { aspect-ratio: 16/9; }
    
    .now-playing { padding: 5px 10px; background: rgba(255,255,255,.02); display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; }
    .now-playing h3 { color: var(--accent); }
    .direct-btn { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 0.7rem; border: 1px solid var(--accent); padding: 2px 6px; border-radius: 4px; }

    .main { max-width: 1200px; margin: 0 auto; padding: 15px; }
    .providers { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .btn { background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; color: #fff; cursor: pointer; white-space: nowrap; font-size: 0.8rem; }
    .btn.active { border-color: var(--accent); background: rgba(0,212,255,.1); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card { background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
    .card:hover { border-color: var(--accent); }
    .card-logo { width: 35px; height: 35px; object-fit: contain; background: rgba(255,255,255,.05); border-radius: 6px; }
    .card-name { font-weight: 700; font-size: 0.75rem; line-height: 1.2; }
    .live-badge { background: #ff006e; color: #fff; padding: 1px 5px; border-radius: 4px; font-size: 0.6rem; font-weight: 900; align-self: flex-start; }

    .footer { margin-top: 30px; padding: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.8rem; color: var(--muted); }
    .footer a { color: var(--accent); text-decoration: none; font-weight: 700; }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .player-container { max-width: 100%; border-radius: 0; }
    }
  </style>

  const state = { all: CHANNELS, provider: 'all', search: '', plyr: null, hls: null };

  function initPlayer() {
    state.plyr = new Plyr('#player', { autoplay: true, settings: ['quality'] });
  }

  function play(ch) {
    document.getElementById('stickyPlayer').classList.add('show');
    document.getElementById('nowTitle').textContent = ch.name;
    document.getElementById('directLink').href = ch.url;
    
    const video = document.getElementById('player');
    if (state.hls) state.hls.destroy();

    if (Hls.isSupported() && ch.url.includes('m3u8')) {
      state.hls = new Hls();
      state.hls.loadSource(ch.url);
      state.hls.attachMedia(video);
      state.hls.on(Hls.Events.MANIFEST_PARSED, () => {
        const levels = state.hls.levels;
        if (levels.length > 0) {
          const opts = levels.map(l => l.height).sort((a,b) => b-a);
          state.plyr.setOptions({ quality: { default: opts[0], options: opts, forced: true, onChange: (h) => {
            state.hls.currentLevel = levels.findIndex(l => l.height === h);
          }}});
        }
        video.play();
      });
    } else {
      video.src = ch.url;
      video.play();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' }); if(state.player) state.player.play();
  }

  function render() {
    const q = state.search.toLowerCase();
    const filtered = state.all.filter(c => (state.provider === 'all' || c.provider === state.provider) && (!q || c.name.toLowerCase().includes(q)));
    
    document.getElementById('channelGrid').innerHTML = filtered.slice(0, 400).map(ch => `
      <div class="card" onclick="playChannel('${btoa(ch.url)}')">
        <img class="card-logo" src="${ch.logo || ''}" onerror="this.style.display='none'">
        <div class="card-name">${ch.name}</div>
        <div class="live-badge">LIVE</div>
      </div>
    `).join('');
  }

  window.playChannel = b64 => {
    const url = atob(b64);
    const ch = state.all.find(c => c.url === url);
    if (ch) play(ch);
  };

  window.setProvider = p => { state.provider = p; render(); };

  document.addEventListener('DOMContentLoaded', () => {
    initPlayer();
    const ps = [...new Set(state.all.map(c => c.provider))];
    document.getElementById('providerList').innerHTML = `<button class="btn" onclick="setProvider('all')">All</button>` + ps.map(p => `<button class="btn" onclick="setProvider('${p}')">${p}</button>`).join('');
    render();
    document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; render(); });
    setTimeout(() => document.getElementById('preloader').style.display = 'none', 1000);
    
    // Protect
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => { if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 's'))) e.preventDefault(); });
  });
  </script>
